<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Math Bro 💀</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calculator">

        <!-- HEADER -->
        <header class="top">
            <div>
                <p class="eyebrow">CALCULATOR.EXE</p>
                <h1>Math Bro 💀</h1>
            </div>

            <div class="status">
                <span class="dot"></span>
                ALIVE
            </div>
        </header>


        <!-- FUNNY MESSAGE -->
        <section class="message-box">
            <span id="emoji">🤨</span>

            <p id="message">
                What are you calculating now?
            </p>
        </section>


        <!-- DISPLAY -->
        <section class="display">

            <div id="expression" class="expression">
                0
            </div>

            <div id="answer" class="answer">
                0
            </div>

        </section>


        <!-- CALCULATOR BUTTONS -->
        <section class="buttons">

            <button class="special" onclick="clearCalculator()">
                C
            </button>

            <button class="special" onclick="deleteLast()">
                ←
            </button>

            <button class="operator" onclick="appendOperator('%')">
                %
            </button>

            <button class="operator" onclick="appendOperator('/')">
                DIV
            </button>


            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>

            <button class="operator" onclick="appendOperator('*')">
                ×
            </button>


            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>

            <button class="operator" onclick="appendOperator('-')">
                −
            </button>


            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>

            <button class="operator" onclick="appendOperator('+')">
                +
            </button>


            <button class="zero" onclick="appendNumber('0')">
                0
            </button>

            <button onclick="appendNumber('.')">
                .
            </button>

            <button class="equals" onclick="calculate()">
                DO THE MATH 🧠
            </button>

        </section>


        <!-- FUNNY ACTIONS -->
        <section class="fun-buttons">

            <button onclick="roastMe()">
                🔥 ROAST MY MATH
            </button>

            <button onclick="randomMath()">
                🎲 I'M FEELING LUCKY
            </button>

        </section>


        <!-- HISTORY -->
        <section class="history">

            <div class="history-header">
                <h2>History of Bad Decisions 💀</h2>

                <button onclick="clearHistory()">
                    CLEAR
                </button>
            </div>

            <div id="historyList">
                <p class="empty">
                    No bad decisions yet...
                </p>
            </div>

        </section>


        <footer>
            Made with questionable mathematical decisions.
        </footer>

    </main>


    <script src="script.js"></script>

</body>
</html>
